perception_markers_node:
  ros__parameters:
    input_objects_topic: "/perception/object_recognition/detection/objects"
    input_traffic_signals_topic: "/perception/traffic_light_recognition/traffic_signals"

    object_markers_topic: "/perception/object_recognition/detection/objects/markers"
    signal_markers_topic: "/perception/traffic_light_recognition/traffic_signals/markers"
    lane_vehicle_markers_topic: "/perception/traffic_light_recognition/lane_vehicles"

    marker_lifetime_s: 0.5

    # Placeholder position for traffic-light spheres - see README (no
    # lanelet2 map yet to look up each signal group's real location).
    # All groups sit at this x/z (the intersection stop line ahead of
    # ego) and are spread out across y, one per lane, lane_spacing_m
    # apart and centered on traffic_light_y - see marker_builder.py.
    traffic_light_frame_id: "map"
    traffic_light_x: 10.0
    traffic_light_y: 0.0
    traffic_light_z: 3.0
    traffic_light_lane_spacing_m: 4.0

    # One demo car per lane, parked approach_distance_m behind its own
    # light's stop line, colored red/green by that lane's own state only
    # (independent of the real ego vehicle's combined decision) - see
    # README and build_lane_vehicle_markers().
    lane_vehicle_approach_distance_m: 6.0
